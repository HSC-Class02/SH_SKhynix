name: Update DART Financial Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '10 0 1 * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run DART pipeline
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY || secrets.OPENDART_API_KEY }}
          DART_CORP_CODE: '00164779'
          START_YEAR: '2010'
        run: python scripts/run_pipeline.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data dashboard/data.js
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m "chore: update SK hynix DART financial data"
            git push
          fi
