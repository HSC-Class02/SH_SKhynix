<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SK hynix Financial Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="data.js"></script><style>
body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:#eef8ff;color:#12304d}header{background:linear-gradient(135deg,#063d82,#0872d7);color:#fff;padding:34px 6vw}h1{margin:0 0 8px}.wrap{padding:26px 6vw}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,section{background:#fff;border:1px solid #d6ebf8;border-radius:18px;padding:20px;box-shadow:0 10px 30px #0066aa12;margin-bottom:18px}.card strong{display:block;font-size:24px;color:#0753a6;margin-top:8px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #e4f0f7;text-align:right}th:first-child,td:first-child{text-align:left}th{background:#f2f9fd} .badge{display:inline-block;background:#dff2ff;color:#0753a6;border-radius:999px;padding:7px 10px;margin:3px;font-size:11px}@media(max-width:800px){.cards,.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.cards,.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>SK hynix · Financial Dashboard</h1><div>DART 정기보고서 기반 · 2010년 이후 · Annual / Half-year / Quarterly</div></header><main class="wrap"><div id="cards" class="cards"></div><div class="grid"><section><h2>Revenue & Operating Profit</h2><canvas id="trend"></canvas></section><section><h2>Key Ratios</h2><canvas id="ratios"></canvas></section></div><section><h2>Annual</h2><div id="annual"></div></section><section><h2>Half-year</h2><div id="half"></div></section><section><h2>Quarterly</h2><div id="quarter"></div></section><section><h2>Domestic Peer Firms</h2><div class="badge">삼성전자</div><div class="badge">DB하이텍</div><div class="badge">SK실트론</div><div class="badge">한미반도체</div></section></main><script>
const d=(window.FINANCIAL_DATA||[]);const a=d.filter(x=>String(x.report)==='11011'),h=d.filter(x=>String(x.report)==='11012'),q=d.filter(x=>['11013','11014'].includes(String(x.report)));const latest=a[a.length-1]||{};function f(v){return v==null||Number.isNaN(Number(v))?'-':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2})}document.getElementById('cards').innerHTML=[['Latest Year',latest.year||'-'],['Revenue',f(latest.revenue)],['Operating Profit',f(latest.operating_profit)],['Net Income',f(latest.net_income)]].map(x=>`<div class="card">${x[0]}<strong>${x[1]}</strong></div>`).join('');const cols=['year','revenue','operating_profit','net_income','total_assets','total_liabilities','total_equity','operating_margin','net_margin','roe','roa','current_ratio','debt_to_equity'];function table(x){if(!x.length)return'<p>데이터 없음</p>';return`<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${x.map(r=>`<tr>${cols.map(c=>`<td>${c==='year'?r[c]:f(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}document.getElementById('annual').innerHTML=table(a);document.getElementById('half').innerHTML=table(h);document.getElementById('quarter').innerHTML=table(q);new Chart(document.getElementById('trend'),{type:'line',data:{labels:a.map(x=>x.year),datasets:[{label:'Revenue',data:a.map(x=>x.revenue)},{label:'Operating Profit',data:a.map(x=>x.operating_profit)}]}});new Chart(document.getElementById('ratios'),{type:'bar',data:{labels:a.slice(-8).map(x=>x.year),datasets:[{label:'Operating Margin',data:a.slice(-8).map(x=>x.operating_margin)},{label:'ROE',data:a.slice(-8).map(x=>x.roe)}]}});</script></body></html>
